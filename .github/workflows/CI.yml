name: DreamPipe checks

on:
  push:
    branches: [main, master, 'dreampipe/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and pinned engine modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install the pinned Android platform and NDK
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' 'build-tools;37.0.0' 'ndk;21.0.6113669' > /dev/null
      - name: Portable model and transaction checks
        run: bash tools/test-dreampipe-host.sh
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon :common:testDebugUnitTest :smarttubetv:testStmobileDebugUnitTest :smarttubetv:lintStmobileDebug :smarttubetv:assembleStmobileDebug
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: DreamPipe-check-reports
          path: |
            common/build/reports/
            smarttubetv/build/reports/
      - name: Save debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: DreamPipe-debug
          path: smarttubetv/build/outputs/renamed_apks/stmobileDebug/DreamPipe_*.apk
          if-no-files-found: error
